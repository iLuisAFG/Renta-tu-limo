<!DOCTYPE html>
<html lang="es-MX" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página no encontrada | Renta tu Limo</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#08090C" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #08090C;
        color: #CBD5E1;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        box-sizing: border-box;
      }
      .card {
        max-width: 500px;
        padding: 40px 24px;
      }
      h1 {
        font-size: 32px;
        color: #F5F5F7;
        margin-bottom: 12px;
        font-weight: 400;
      }
      p {
        font-size: 14px;
        color: #94A3B8;
        line-height: 1.6;
        margin-bottom: 28px;
      }
      a {
        display: inline-block;
        background-color: #DDB789;
        color: #08090C;
        padding: 12px 28px;
        border-radius: 9999px;
        text-decoration: none;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      a:hover {
        background-color: #E8C8A3;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div style="color: #DDB789; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 8px;">Error 404</div>
      <h1>Página no encontrada</h1>
      <p>La página que buscas no existe o fue movida. Te invitamos a consultar nuestra flota de limusinas y servicios de transporte en el sitio principal.</p>

    </div>
  </body>
</html>
